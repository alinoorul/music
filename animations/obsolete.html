'use strict';
/*
  Obsolete: an animation for a loop of Tame Impala's "Obsolete", in the style of Maya Lila Claude and Self Calls Self.
  A white self (me) and a green self (you) stand apart on a glass floor. Me calls you on every second beat; you do
  not answer. Every two bars me sends out a new version of its love, a small self labelled "love v1.0", "v1.1" and
  so on. Each version calls you too, gets no answer, is labelled "__obsolete", slumps, and sinks through the floor,
  where it lurks underneath, near a warning sign that blinks where no one looks. Near the end of each loop you answer
  once, and me sends out a burst of selves that do the rest, then fold up and fly home as the loop starts again.

  Fitted to obsolete_loop_2.mp3 (92.5 s): 103.784 bpm, an 8-bar loop of exactly 18.5 s that starts 0.771 s before

  and from bar 7 beat 2 to the end of bar 8 (the second line); you answer as the second line starts, and the burst
  does the rest. The figures dip on the measured kick and bass, and me calls on every beat while the voice is strong.
  The whole scene repeats exactly every 5 loops (92.5 s), so the video loops with the audio file for any length.

  To use other music: set ?bpm= and ?offset= (the start of a loop, in seconds; it can be negative), or tap T on the
  beat while the music plays (drop the audio file on the page to play it here; the export has no sound). Every frame
  is a pure function of the time t, so the page seeks, and exports frame by frame to an MP4 file (key E).

*/

// ---------- the beat ----------

const cv = document.getElementById('c');

function partial(pts, k) {                             // a polyline drawn up to the fraction k of its length
  if (k <= 0) return;
  const lens = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); lens.push(l); total += l; }
  let left = total * Math.min(1, k);
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const u = Math.min(1, left / (lens[i - 1] || 1));
    ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u));
    left -= lens[i - 1];
  }
}

// grow: 0..1, how far the figure has unfolded out of its bud (or folded back into it)
function drawStick(f, J, color, alpha, grow = 1) {

  partial([J.hip, J.kneeL, J.footL], kLeg); partial([J.hip, J.kneeR, J.footR], kLeg);
  if (kHead > 0) {

function drawWifi(p, dir, s, col, alpha, t, reveal) { // a wifi symbol: a dot, and three arcs that open toward dir
  if (alpha <= 0.003) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.fillStyle = rgba(col, alpha);
  ctx.beginPath(); ctx.arc(p[0], p[1], 2 + 0.5 * s, 0, 6.2832); ctx.fill();
  for (let k = 0; k < 3; k++) {

// ---------- what is happening at time t ----------
const VERSIONS = 4 * LOOPS;                            // versions in one video loop: then the numbers start again
const vName = (k) => { const n = mod(k, VERSIONS); return 'love v' + (1 + Math.floor(n / 10)) + '.' + (n % 10); };
function version(k, b) {                               // version k of my love, b beats after it was sent out
  const R = rngOf(mod(k, VERSIONS), 1), s = STEP / 8; // its timeline is in eighths of STEP (8 beats in an 8-bar loop)
  const h = ME.h * (0.46 + 0.12 * R()), x = lerp(830, 1120, R()), bend = (R() < 0.5 ? -1 : 1) * (0.15 + 0.2 * R());
  const v = { k, b, h, x, feet: FLOOR, ph: R() * 6.28, bend, lurkX: lerp(YOU.x - 260, YOU.x + 300, R()), s };
  v.fly = 1.5 * s; v.grown = 2.5 * s; v.tag = [10 * s, 12 * s]; v.sink = [12 * s, 16 * s]; v.gone = 40 * s;
  v.calls = [3, 5, 7, 9].map((c) => c * s);

}
function versionsAt(B) {

function scene(t) {                                    // every figure, signal and thread at time t
  const B = beatOf(t), q = CB / 32, c = Math.floor(B / CB), cb = B - c * CB;

  const sig = [], threads = [], up = [], under = [];

  // you: the phone comes up only to answer
  you.p.wp = win(B, A0 - 1 * q, A0 + 2.5 * q, 0.6 * q);
  // me: arms up when the answer arrives
  const arrive = A0 + LEAD * q + 1.5 * q;
  me.p.wu = win(B, arrive - 0.2 * q, arrive + 1.4 * q, 0.5 * q);
  // me calls you on every second beat, and on every beat while the voice is strong; not while you answer
  for (let e = Math.floor(B); e > B - 2.6; e--) {
    const ec = mod(e, CB), v = Math.max(voiceAt(e), voiceAt(e + 0.5));

    out.p.slump = smooth(v.tag[0], v.sink[0] + 1 * v.s, b);
    out.color = mix(GREEN.map((x) => x * 0.95), DIM, out.tagged);
    if (b < v.fly) threads.push({ a: chest(ME), b: chest(out.f), bend: v.bend, k: easeInOut(b / v.fly), col: GREEN });

    if (b < v.sink[0]) up.push(out);
    else if (b < v.sink[1]) {                          // it sinks through the glass floor

      up.push(out); under.push(out);

      const k = smooth(v.sink[1], v.gone, b);

      out.f.x = lerp(v.x, v.lurkX, smooth(v.sink[1], v.sink[1] + 14 * v.s, b));

// ---------- drawing ----------
function drawThreads(now) {
  ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for (const th of now.threads) {
    const m = bendPoint(th.a, th.b, th.bend);
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) { const p = quad(th.a, m, th.b, th.k * i / 24); if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }

    if (th.k < 1 || th.home) {                         // the bud on its way out, or home
      const p = quad(th.a, m, th.b, th.k);
      ctx.fillStyle = rgba(th.col, 0.25); ctx.beginPath(); ctx.arc(p[0], p[1], 10, 0, 6.2832); ctx.fill();
      ctx.fillStyle = rgba(mix(th.col, WHITE, 0.5), 1); ctx.beginPath(); ctx.arc(p[0], p[1], 3.6, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSignals(now, t) {
  const B = now.B;
  for (const w of now.sig) {
    if (B < w.t0 || B > w.t1) continue;
    const pa = w.from === ME ? now.me.p : w.from === YOU ? now.you.p : (w.pose ? w.pose.p : {});
    const pb = w.to === ME ? now.me.p : w.to === YOU ? now.you.p : {};
    const A = jointsOf(w.from, pa, t), Bj = jointsOf(w.to, pb, t), lead = LEAD * (w.beatScale || 1);
    const dx = Bj.head[0] - A.head[0], dy = Bj.head[1] - A.head[1], d = Math.hypot(dx, dy) || 1;
    const a = [A.head[0] + dx / d * A.headR * 1.4, A.head[1] + dy / d * A.headR * 1.4];
    const b = [Bj.head[0] - dx / d * (Bj.headR * 1.3 + 6), Bj.head[1] - dy / d * (Bj.headR * 1.3 + 6)];
    const m = bendPoint(a, b, -0.12), u = clamp01((B - w.t0 - lead) / (w.t1 - w.t0 - lead));
    const p = quad(a, m, b, u), tg = quadTan(a, m, b, u);
    // a call to you that is not answered fades away before it reaches you
    const al = w.to === YOU ? 1 - smooth(0.6, 0.95, u) : 1 - smooth(0.92, 1, u);
    drawWifi(p, Math.atan2(tg[1], tg[0]), w.size * Math.min(2.4, 0.8 + u * d / 600), w.col, al, t, (B - w.t0) / lead * 3);
  }
}

function drawLabel(o, J, t, alpha) {                   // "love vX.Y", and "__obsolete" typed out after it
  const v = o.v, size = Math.round(13 + 0.06 * o.f.h), x = J.head[0], y = J.head[1] - J.headR - 14;
  const name = vName(v.k), tag = '__obsolete', n = Math.round(tag.length * o.tagged);
  ctx.font = '600 ' + size + 'px ' + MONO;
  const w1 = ctx.measureText(name + ' ').width;
  ctx.font = '600 ' + size + 'px ' + SANS;
  const w2 = ctx.measureText(tag.slice(0, n)).width;
  let x0 = x - (w1 + w2) / 2;
  ctx.textBaseline = 'alphabetic';
  ctx.font = '600 ' + size + 'px ' + MONO;
  ctx.fillStyle = rgba(mix(GREEN, DIM, o.tagged), alpha * clamp01((v.b - v.fly) / v.s));
  ctx.fillText(name + ' ', x0, y);
  if (n > 0) { ctx.font = '600 ' + size + 'px ' + SANS; ctx.fillStyle = rgba(WHITE, alpha * 0.85); ctx.fillText(tag.slice(0, n), x0 + w1, y); }
}

function drawFigures(list, t, alphaScale, clipAbove) {
  for (const o of list) {
    const J = jointsOf(o.f, o.p, t), a = (o.alpha ?? 1) * alphaScale;
    drawStick(o.f, J, o.color || o.f.color, a, o.grow ?? 1);
    if (o.v && (o.grow ?? 1) > 0.5) drawLabel(o, J, t, a);
  }
}

function drawUnder(now, t) {                           // below the glass floor: the reflection, what sank, and the warning sign
  ctx.save();
  ctx.beginPath(); ctx.rect(0, FLOOR, VW, VH - FLOOR); ctx.clip();
  ctx.save();                                          // the reflection of the two selves, faint
  ctx.translate(0, 2 * FLOOR); ctx.scale(1, -1);
  drawStick(ME, jointsOf(ME, now.me.p, t), WHITE, 0.1);
  drawStick(YOU, jointsOf(YOU, now.you.p, t), GREEN, 0.1);
  ctx.restore();
  for (const o of now.under) {                         // the obsolete versions, lurking underneath
    const J = jointsOf(o.f, o.p, t), a = 0.3 * (o.alpha ?? 1);
    drawStick(o.f, J, DIM, a);
    drawLabel(o, J, t, a);
  }
  const B = now.B, blink = 0.05 + 0.13 * Math.max(0, Math.sin(Math.PI * B / 2)) ** 4;   // a warning sign no one sees
  const wx = YOU.x + 40, wy = FLOOR + 175, r = 26;
  ctx.beginPath(); ctx.moveTo(wx, wy - r); ctx.lineTo(wx + r * 0.95, wy + r * 0.65); ctx.lineTo(wx - r * 0.95, wy + r * 0.65); ctx.closePath();
  ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.strokeStyle = rgba(GREEN, blink); ctx.stroke();
  ctx.fillStyle = rgba(GREEN, blink); ctx.font = '700 22px ' + SANS; ctx.textAlign = 'center'; ctx.fillText('!', wx, wy + r * 0.45); ctx.textAlign = 'left';
  const grad = ctx.createLinearGradient(0, FLOOR, 0, VH);   // the deeper, the darker
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = grad; ctx.fillRect(0, FLOOR, VW, VH - FLOOR);
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter';           // the glass floor
  const fg = ctx.createLinearGradient(0, 0, VW, 0);
  fg.addColorStop(0, 'rgba(0,255,65,0)'); fg.addColorStop(0.2, 'rgba(0,255,65,0.22)'); fg.addColorStop(0.8, 'rgba(0,255,65,0.22)'); fg.addColorStop(1, 'rgba(0,255,65,0)');
  ctx.fillStyle = fg; ctx.fillRect(0, FLOOR - 0.75, VW, 1.5);
  ctx.globalCompositeOperation = 'source-over';
}

const RAIN = (() => {                                  // faint labels of old drafts (v0.x) falling behind everything
  const R = rng(SEED * 31 + 5), list = [];
  for (let i = 0; i < 34; i++) list.push({ x: (i / 34) * VW + (R() - 0.5) * 50, y: R() * (VH + 200), v: 1 + ((R() * 3) | 0), s: 11 + R() * 11,
    a: 0.05 + R() * 0.09, k: (R() * 10) | 0 });
  return list;
})();
function drawRain(t) {
  for (const d of RAIN) {
    const y = mod(d.y + (VH + 200) * d.v * t / periodS(), VH + 200) - 100;   // a whole number of falls in each video loop
    ctx.font = '600 ' + d.s.toFixed(0) + 'px ' + MONO;
    ctx.fillStyle = rgba(GREEN, d.a);
    const name = 'love v0.' + d.k;
    ctx.fillText(name, d.x, y);
    const w = ctx.measureText(name + ' ').width;
    ctx.font = '600 ' + d.s.toFixed(0) + 'px ' + SANS;
    ctx.fillText('__obsolete', d.x + w, y);
  }
}

function drawTitle() {                                 // OBSOLETE: centred across, its letters centred at TITLE_Y of the height
  if (!SHOW_TITLE) return;
  ctx.font = '600 136px ' + SANS;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '32px';
  const m = ctx.measureText('OBSOLETE'), lift = ((m.actualBoundingBoxAscent || 98) - (m.actualBoundingBoxDescent || 0)) / 2;
  const shift = 'letterSpacing' in ctx ? 16 : 0;       // the spacing after the last letter: half of it moves the word off centre
  ctx.fillStyle = rgba(WHITE, 0.88);
  ctx.fillText('OBSOLETE', VW / 2 + shift, TITLE_Y * VH + lift);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  ctx.textAlign = 'left';
}

function render(t) {
  const now = scene(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(SC, 0, 0, SC, OX, OY);
  drawRain(t);
  drawUnder(now, t);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, FLOOR); ctx.clip();   // above the floor
  drawThreads(now);
  drawSignals(now, t);
  drawFigures(now.up, t, 1);
  drawStick(YOU, jointsOf(YOU, now.you.p, t), GREEN, 1);
  drawStick(ME, jointsOf(ME, now.me.p, t), WHITE, 1);
  ctx.restore();
  drawTitle();
}

// ---------- playing, with or without your audio ----------
const hud = document.getElementById('hud'), timeEl = document.getElementById('time'), msgEl = document.getElementById('msg');
const seek = document.getElementById('seek');
seek.max = 600;
let playing = false, tNow = num('t', 0), wall0 = 0, t0 = 0, exporting = null, audio = null, taps = [];
const fmt = (s) => Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0');
function showTime() {
  const B = beatOf(tNow), bar = Math.floor(mod(B, CB) / 4) + 1, beat = Math.floor(mod(B, 4)) + 1;
  const loop = Math.floor(mod(B, CB * LOOPS) / CB) + 1;
  timeEl.textContent = fmt(tNow) + '   loop ' + loop + '/' + LOOPS + ' bar ' + bar + '/' + BARS + ' beat ' + beat + '   ' + BPM.toFixed(3) + ' bpm, loop start ' + OFFSET.toFixed(3) + ' s';
  seek.value = Math.min(tNow, seek.max);
}
function say(text) { msgEl.textContent = text; }
function frame(now) {
  if (!playing) return;
  tNow = audio ? audio.currentTime : t0 + (now - wall0) / 1000;
  render(tNow);
  requestAnimationFrame(frame);
}
function setPlaying(on) {
  if (exporting) return;
  playing = on;
  document.body.classList.toggle('playing', on);
  if (audio) { if (on) { audio.currentTime = tNow; audio.play(); } else audio.pause(); }
  if (on) { wall0 = performance.now(); t0 = tNow; requestAnimationFrame(frame); }
  else { render(tNow); showTime(); }
}
function goTo(t) {
  tNow = Math.max(0, t);
  if (audio) audio.currentTime = tNow;
  if (playing) { wall0 = performance.now(); t0 = tNow; } else { render(tNow); showTime(); }
}
function useAudio(file) {                              // your music, to see the animation with it (the export has no sound)
  if (!file || !/^audio\//.test(file.type)) return;
  if (audio) { audio.pause(); URL.revokeObjectURL(audio.src); }
  audio = new Audio(URL.createObjectURL(file));
  audio.loop = true;
  say('Music: ' + file.name + '. Press Space to play, and tap T on the beat to set the tempo.');
  goTo(0);
}
function tap() {                                       // tap T on the beat: four taps or more set the tempo and the first beat
  const now = playing ? tNow : performance.now() / 1000;
  if (taps.length && now - taps[taps.length - 1] > 2.5) taps = [];
  taps.push(now);
  if (taps.length < 4) { say('Tap ' + (4 - taps.length) + ' more...'); return; }
  const gaps = taps.slice(1).map((x, i) => x - taps[i]).sort((a, b) => a - b), beat = gaps[gaps.length >> 1];
  BPM = Math.round(600 / beat) / 10;
  if (playing) OFFSET = now - Math.round((now - OFFSET) * BPM / 60) * 60 / BPM;   // on your tap, but still in the same bar
  keepInAddress();
  say('Tempo ' + BPM.toFixed(1) + ' bpm' + (playing ? ', first beat at ' + OFFSET.toFixed(2) + ' s' : ' (play the music to set the first beat too)'));
  showTime();
}
function keepInAddress() {                             // so the tempo stays when you reload or export
  const u = new URL(location.href);
  u.searchParams.set('bpm', BPM.toFixed(1)); u.searchParams.set('offset', OFFSET.toFixed(3));
  history.replaceState(null, '', u);
}
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit);
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); useAudio(e.dataTransfer.files[0]); });
document.getElementById('audio').addEventListener('change', (e) => useAudio(e.target.files[0]));
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'escape' && exporting) { exporting.cancel = true; return; }
  if (exporting) return;
  if (k === ' ' || k === 'k') setPlaying(!playing);
  else if (k === 'arrowleft' || k === 'arrowright') goTo(tNow + (k === 'arrowleft' ? -1 : 1) * (e.shiftKey ? 30 : 5));
  else if (k === 'home') goTo(0);
  else if (k === 't') tap();
  else if (k === ',' || k === '.') { OFFSET += k === ',' ? -0.01 : 0.01; keepInAddress(); if (!playing) render(tNow); showTime(); }
  else if (k === 'a') document.getElementById('audio').click();
  else if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'h') hud.classList.toggle('off');
  else if (k === 'e') exportVideo();
  else return;
  e.preventDefault();
  if (document.activeElement === seek) seek.blur();
});
cv.addEventListener('click', () => { if (!exporting) setPlaying(!playing); });
seek.addEventListener('input', () => goTo(parseFloat(seek.value)));

// ---------- exporting an MP4, frame by frame ----------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function pickCodec(w, h, fps, bitrate) {
  const mbs = Math.ceil(w / 16) * Math.ceil(h / 16), rate = mbs * fps;
  const L = [[0x28, 8192, 245760], [0x2a, 8704, 522240], [0x32, 22080, 589824], [0x33, 36864, 983040], [0x34, 36864, 2073600], [0x3c, 139264, 4177920]];
  const lv = (L.find(([, fs, mr]) => mbs <= fs && rate <= mr) || L[L.length - 1])[0].toString(16).padStart(2, '0');
  const px = w * h, vlv = px <= 2228224 ? (fps <= 30 ? 40 : 41) : px <= 8912896 ? (fps <= 30 ? 50 : 51) : 60;
  const tries = ['avc1.6400' + lv, 'avc1.4d00' + lv, 'avc1.4200' + lv].map((codec) => ({ kind: 'avc1', codec, extra: { avc: { format: 'avc' } } }));
  tries.push({ kind: 'vp09', codec: 'vp09.00.' + vlv + '.08', level: vlv, extra: {} });
  for (const tr of tries) {
    const config = { codec: tr.codec, width: w, height: h, bitrate, framerate: fps, bitrateMode: 'variable', latencyMode: 'quality', ...tr.extra };
    try { if ((await VideoEncoder.isConfigSupported(config)).supported) return { kind: tr.kind, level: tr.level, config }; } catch (e) { /* try the next one */ }
  }
  return null;
}

async function exportVideo() {
  if (exporting) return;
  if (typeof VideoEncoder === 'undefined') { say('This browser cannot export video. Use Chrome, Edge or Safari, or record the screen.'); hud.classList.remove('off'); return; }
  setPlaying(false);
  hud.classList.remove('off');
  await fontReady;                                     // no frame is drawn with a stand-in font
  const from = num('from', 0);
  let to = num('to', NaN);
  if (!Number.isFinite(to)) {                          // ask for the length: for example the length of the song
    const ans = prompt('Video length, as minutes:seconds. ' + lengthText() + ' is one loop of the video, the same as your audio file:', lengthText());
    if (ans === null) return;
    to = from + parseTime(ans);
  }
  if (!(to > from)) { say('That is not a length. Write it as minutes:seconds, for example 3:45.'); return; }
  const choice = await pickCodec(W, H, FPS, MBPS * 1e6);
  if (!choice) { say('This browser has no H.264 or VP9 encoder. Record the screen instead.'); return; }
  const job = (exporting = { cancel: false });
  const timescale = FPS * 1000, frameTicks = 1000, samples = [];
  let description = null, failed = null;
  const enc = new VideoEncoder({
    output(chunk, meta) {
      const d = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (d && !description) description = new Uint8Array(ArrayBuffer.isView(d) ? d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength) : d.slice(0));
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      samples.push({ data, pts: Math.round(chunk.timestamp * timescale / 1e6), key: chunk.type === 'key' });
    },
    error(e) { failed = e; },
  });
  enc.configure(choice.config);
  const first = Math.round(from * FPS), n = Math.max(1, Math.round(to * FPS) - first);
  const label = choice.kind === 'avc1' ? 'H.264' : 'VP9 (this browser has no H.264 encoder)';
  for (let i = 0; i < n && !job.cancel && !failed; i++) {
    render((first + i) / FPS);
    const vf = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: i % (FPS * 2) === 0 });
    vf.close();
    while (enc.encodeQueueSize > 4 && !failed) await sleep(1);
    if (i % 10 === 0) {
      tNow = (first + i) / FPS; showTime();
      say('Exporting ' + W + 'x' + H + ' ' + FPS + ' fps ' + label + ': ' + Math.floor(100 * i / n) + '%. Keep this tab in front. Esc cancels.');
      await sleep(0);
    }
  }
  try { if (!job.cancel && !failed) await enc.flush(); } catch (e) { failed = failed || e; }
  try { enc.close(); } catch (e) { /* already closed */ }
  exporting = null;
  if (failed) say('Export failed: ' + failed.message);
  else if (job.cancel) say('Export cancelled.');
  else {
    const blob = muxMP4({ kind: choice.kind, level: choice.level, width: W, height: H, timescale, frameTicks, description, samples });
    const len = to - from, name = 'obsolete-' + Math.floor(len / 60) + 'm' + String(Math.round(len % 60)).padStart(2, '0') + 's-' + W + 'x' + H + '-' + FPS + 'fps.mp4';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    say('Saved ' + name + ' (' + (blob.size / 1e6).toFixed(1) + ' MB, ' + label + ').');
    window.lastExport = blob;
  }
  render(tNow); showTime();
}
</script>

<script id="mp4">
// A small MP4 (ISO BMFF) writer for one video track. samples: encoded frames in decode order, each
// { data: Uint8Array, pts: presentation time in timescale units, key: boolean }. kind: 'avc1' (description is the
// AVCDecoderConfigurationRecord) or 'vp09' (level is the VP9 level). Frames reordered by the encoder get a ctts
// box and an edit list. The moov box comes first, so the file plays while it downloads.
function muxMP4({ kind, level, width, height, timescale, frameTicks, description, samples }) {
  const u16 = (v) => [(v >>> 8) & 255, v & 255];
  const u32 = (v) => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];
  const u64 = (v) => { const hi = Math.floor(v / 4294967296); return [...u32(hi), ...u32(v - hi * 4294967296)]; };
  const str = (s) => Array.from(s, (c) => c.charCodeAt(0));
  const box = (type, ...parts) => {
    let len = 8;
    for (const p of parts) len += p.length;
    const out = new Uint8Array(len);
    out.set(u32(len), 0); out.set(str(type), 4);
    let o = 8;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  };
  const fbox = (type, version, flags, ...parts) => box(type, [version, (flags >>> 16) & 255, (flags >>> 8) & 255, flags & 255], ...parts);
  const zeros = (n) => new Uint8Array(n);

  const n = samples.length;
  const sorted = samples.map((s) => s.pts).sort((a, b) => a - b);
  let delay = 0;
  for (let k = 0; k < n; k++) delay = Math.max(delay, sorted[k] - samples[k].pts);
  const dts = sorted.map((p) => p - delay);
  const offsets = samples.map((s, k) => s.pts - dts[k]);
  const duration = sorted[n - 1] - sorted[0] + frameTicks;
  const runs = (values) => { const r = []; for (const v of values) { const last = r[r.length - 1]; if (last && last[1] === v) last[0]++; else r.push([1, v]); } return r; };
  const stts = runs(dts.map((d, k) => (k + 1 < n ? dts[k + 1] - d : frameTicks)));
  const ctts = offsets.some((o) => o !== 0) ? runs(offsets) : null;
  const keys = [];
  samples.forEach((s, k) => { if (s.key) keys.push(k + 1); });
  const dataLen = samples.reduce((a, s) => a + s.data.length, 0);
  const mdatHead = dataLen + 8 > 0xffffffff ? [...u32(1), ...str('mdat'), ...u64(dataLen + 16)] : [...u32(dataLen + 8), ...str('mdat')];
  const matrix = [0x10000, 0, 0, 0, 0x10000, 0, 0, 0, 0x40000000].flatMap(u32);

  let config;
  if (kind === 'avc1') config = box('avcC', description);
  else config = fbox('vpcC', 1, 0, [0, level, (8 << 4) | (1 << 1) | 0, 2, 2, 2], u16(0));   // colours: as the stream says
  const entry = box(kind, zeros(6), u16(1), u16(0), u16(0), zeros(12), u16(width), u16(height), u32(0x480000), u32(0x480000),
    u32(0), u16(1), zeros(32), u16(0x18), u16(0xffff), config, box('pasp', u32(1), u32(1)));
  const stbl = (offset) => box('stbl',
    fbox('stsd', 0, 0, u32(1), entry),
    fbox('stts', 0, 0, u32(stts.length), stts.flatMap(([c, d]) => [...u32(c), ...u32(d)])),
    ...(ctts ? [fbox('ctts', 0, 0, u32(ctts.length), ctts.flatMap(([c, o]) => [...u32(c), ...u32(o)]))] : []),
    fbox('stss', 0, 0, u32(keys.length), keys.flatMap(u32)),
    fbox('stsc', 0, 0, u32(1), u32(1), u32(n), u32(1)),
    fbox('stsz', 0, 0, u32(0), u32(n), samples.flatMap((s) => u32(s.data.length))),
    fbox('stco', 0, 0, u32(1), u32(offset)));
  const moov = (offset) => box('moov',
    fbox('mvhd', 0, 0, u32(0), u32(0), u32(timescale), u32(duration), u32(0x10000), u16(0x100), u16(0), zeros(8), matrix, zeros(24), u32(2)),
    box('trak',
      fbox('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(duration), zeros(8), u16(0), u16(0), u16(0), u16(0), matrix, u32(width * 65536), u32(height * 65536)),
      ...(ctts ? [box('edts', fbox('elst', 0, 0, u32(1), u32(duration), u32(delay), u16(1), u16(0)))] : []),
      box('mdia',
        fbox('mdhd', 0, 0, u32(0), u32(0), u32(timescale), u32(duration), u16(0x55c4), u16(0)),
        fbox('hdlr', 0, 0, u32(0), str('vide'), zeros(12), str('VideoHandler'), [0]),
        box('minf',
          fbox('vmhd', 0, 1, u16(0), u16(0), u16(0), u16(0)),
          box('dinf', fbox('dref', 0, 0, u32(1), fbox('url ', 0, 1))),
          stbl(offset)))));
  const ftyp = box('ftyp', str('isom'), u32(512), str('isom'), str('iso2'), str(kind === 'avc1' ? 'avc1' : 'vp09'), str('mp41'));
  const head = ftyp.length + moov(0).length + mdatHead.length;
  return new Blob([ftyp, moov(head), new Uint8Array(mdatHead), ...samples.map((s) => s.data)], { type: 'video/mp4' });
}
</script>

<script>
// start: draw the first frame, fit the canvas to the window, and play at once with ?autoplay=1
fit(); showTime();
if (Q.get('hud') === '0') hud.classList.add('off');
fontReady.then(() => { render(tNow); if (Q.get('autoplay') === '1') setPlaying(true); });   // draw once the font is ready
window.renderAt = render;                              // for frame-by-frame capture by other tools
window.ANIM = { bpm: () => BPM, offset: () => OFFSET, bars: BARS, width: W, height: H, fps: FPS };
</script>
